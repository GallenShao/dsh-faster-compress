<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Faster Compress — 少等摘要，多做一步。</title>
<desc id="desc">提前准备上下文摘要，把压缩等待藏进工作的间隙。 流程示意，非性能基准；未准备好时仍需等待。</desc>
<defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="12" height="12" patternTransform="rotate(30)"><line x1="0" y1="0" x2="0" y2="12" stroke="#F6D7BC" stroke-width="4"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#0A7A78" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="620" rx="24" fill="#F5FAFC"/>
<g font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif">
<text x="52" y="54" font-family="monospace" font-size="16" font-weight="700" letter-spacing="2" fill="#0A7A78">FASTER COMPRESS / DEEPSEEK HARNESS</text>
<text x="52" y="125" font-size="48" font-weight="800" letter-spacing="-1.5" fill="#153949">少等摘要，多做一步。</text>
<text x="52" y="170" font-size="22" fill="#476777">提前准备上下文摘要，把压缩等待藏进工作的间隙。</text>
<path d="M52 207H1148" stroke="#D5E4EA"/>
<text x="52" y="271" font-size="18" font-weight="600" fill="#6A7E88">原版压缩</text>
<path d="M260 268H1124" stroke="#BDCFD8" stroke-width="2"/>
<rect x="260" y="244" width="150" height="48" rx="10" fill="#E8F0F4"/><text x="335" y="274" text-anchor="middle" fill="#244B5C" font-size="18" font-weight="600">模型请求</text><rect x="426" y="244" width="150" height="48" rx="10" fill="#E8F0F4"/><text x="501" y="274" text-anchor="middle" fill="#244B5C" font-size="18" font-weight="600">工具执行</text>
<rect x="592" y="244" width="310" height="48" rx="10" fill="#FBEBDD"/><rect x="592" y="244" width="310" height="48" rx="10" fill="url(#hatch)"/>
<text x="747" y="275" text-anchor="middle" fill="#944B24" font-size="20" font-weight="700">等待摘要生成</text>
<rect x="918" y="244" width="190" height="48" rx="10" fill="#E8F0F4"/><text x="1013" y="274" text-anchor="middle" fill="#244B5C" font-size="18" font-weight="600">模型请求</text>
<text x="52" y="397" font-size="18" font-weight="700" fill="#0A7A78">Faster Compress</text>
<path d="M260 394H1124" stroke="#BDCFD8" stroke-width="2"/>
<rect x="260" y="370" width="150" height="48" rx="10" fill="#E8F0F4"/><text x="335" y="400" text-anchor="middle" fill="#244B5C" font-size="18" font-weight="600">模型请求</text><rect x="426" y="370" width="150" height="48" rx="10" fill="#E8F0F4"/><text x="501" y="400" text-anchor="middle" fill="#244B5C" font-size="18" font-weight="600">工具执行</text><rect x="592" y="370" width="150" height="48" rx="10" fill="#E8F0F4"/><text x="667" y="400" text-anchor="middle" fill="#244B5C" font-size="18" font-weight="600">继续推进</text><rect x="758" y="370" width="150" height="48" rx="10" fill="#E8F0F4"/><text x="833" y="400" text-anchor="middle" fill="#244B5C" font-size="18" font-weight="600">继续推进</text><rect x="924" y="370" width="184" height="48" rx="10" fill="#D5EFEB"/><text x="1016" y="400" text-anchor="middle" fill="#096661" font-size="18" font-weight="600">继续推进</text>
<path d="M446 424V468H468" fill="none" stroke="#0A7A78" stroke-width="2"/>
<rect x="468" y="444" width="390" height="48" rx="10" fill="#D5EFEB"/><text x="663" y="474" text-anchor="middle" fill="#096661" font-size="18" font-weight="600">后台准备摘要</text>
<path d="M858 468H916V424" fill="none" stroke="#0A7A78" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M916 355V421" stroke="#0A7A78" stroke-width="2" stroke-dasharray="4 5"/>
<text x="916" y="342" text-anchor="middle" font-size="16" font-weight="600" fill="#0A7A78">到阈值，再提交</text>
<path d="M52 530H1148" stroke="#D5E4EA"/>
<text x="52" y="566" font-size="18" fill="#244B5C">默认提前至压缩阈值的 85% 开始准备 · 支持可选缓存预热</text>
<text x="52" y="596" font-size="14" fill="#6A7E88">流程示意，非性能基准；未准备好时仍需等待。</text>
</g></svg>
